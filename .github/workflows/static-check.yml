name: Static Analysis
on:
  push:
    branches: "**"
  pull_request:
    branches: [master]

jobs:
  static-checks:
    name: Run Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cppcheck
      
      - name: Get vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
      
      - name: Configure CMake and fetch dependencies
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

      # Runs seperately due to compilation database / file issue
      - name: Run cpp check 
        run: |
          cppcheck --enable=all --inconclusive --project=build/compile_commands.json \
          --suppress=missingIncludeSystem --error-exitcode=1
